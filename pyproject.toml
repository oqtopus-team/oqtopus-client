[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oqtopus-client"
version = "0.1.0"
description = "Python SDK for OQTOPUS Cloud User API"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "oqtopus-team", email = "oqtopus-team@googlegroups.com" }]
keywords = ["quantum", "oqtopus", "sdk", "openapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.0",
]

[project.urls]
documentation = "https://oqtopus-client.readthedocs.io/"
repository = "https://github.com/oqtopus-team/oqtopus-client"

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29.0",
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.28.0",
  "mypy>=1.11.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "types-PyYAML>=6.0.12.20241230",
]

[tool.pytest.ini_options]
addopts = "--cov=src/oqtopus_client --cov-report=term-missing --cov-fail-under=95"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["src/oqtopus_client/models/generated/*", "src/oqtopus_client/models/generated/models/*"]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "examples/**/*.py"]
exclude = ["src/oqtopus_client/models/generated/**"]
lint.select = ["E", "F", "B"]
lint.ignore = ["E402", "E501"]

[tool.mypy]
files = ["src", "tests", "examples"]
exclude = "src/oqtopus_client/models/generated/.*"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["oqtopus_client*"]
